<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СИМУЛЯТОР ЛОГИНА</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #1c2340 0%, #0e1226 55%, #131033 100%);
    display: flex; align-items: center; justify-content: center;
  }
  #boot {
    position: fixed; inset: 0; z-index: 50; background: #05060f;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #boot h1 { font-size: clamp(26px, 4.6vw, 44px); letter-spacing: 6px; color: #7ea2ff; }
  #boot .sub { margin-top: 12px; color: #66719c; font-style: italic; }
  #bootbar { margin-top: 30px; width: min(320px, 70vw); height: 8px; border-radius: 6px; background: #12172b; overflow: hidden; }
  #bootbar i { display: block; height: 100%; width: 40%; border-radius: 6px; background: linear-gradient(90deg, #335fff, #7ea2ff); animation: bootslide 1.1s linear infinite; }
  @keyframes bootslide { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
  #browser {
    width: min(1060px, 96vw); height: min(700px, calc(92vh - 56px));
    background: #202124; border-radius: 12px; overflow: hidden;
    box-shadow: 0 24px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.06);
    display: flex; flex-direction: column;
    animation: bwin .45s ease;
    position: relative; z-index: 100;
  }
  @keyframes bwin { from { transform: scale(.92); opacity: 0; } }
  #chrome-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; background: #292b2f; }
  .dots span { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; }
  .dots .r{background:#ff5f57}.dots .y{background:#febc2e}.dots .g{background:#28c840}
  #tabstrip { display: flex; gap: 4px; margin-left: 10px; overflow-x: hidden; flex: 1; height: 34px; }
  .tab {
    display: flex; align-items: center; gap: 7px; padding: 0 10px; min-width: 0; max-width: 190px;
    background: #202124; border-radius: 9px 9px 0 0; font-size: 12.5px; color: #b6bdca;
    cursor: pointer; white-space: nowrap; border: 1px solid transparent; border-bottom: none;
    position: relative; flex-shrink: 1;
  }
  .tab.active { background: #35363a; color: #fff; }
  .tab .fav { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { opacity: .55; padding: 0 3px; border-radius: 4px; font-size: 13px; }
  .tab .x:hover { opacity: 1; background: rgba(255,255,255,.15); }
  .tab.shake { animation: tshake .3s; }
  @keyframes tshake { 25% { transform: translateX(-3px);} 75% { transform: translateX(3px);} }
  #urlbar-wrap { padding: 6px 10px; background: #35363a; }
  #urlbar {
    display: flex; align-items: center; gap: 8px; background: #202124; border-radius: 20px;
    padding: 7px 14px; font-size: 13px; color: #dfe3ea;
  }
  #lock { color: #5bb974; font-size: 12px; }
  #url { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; direction: rtl; text-align: left; }
  #levelbadge { font-size: 11px; color: #9aa3bf; background: #17181b; border-radius: 10px; padding: 3px 10px; white-space: nowrap; }
  #viewport { flex: 1; background: #fff; position: relative; overflow: auto; color: #202124; }
  #viewport.dark { background: #101218; color: #dfe3ea; }

  .center-col { max-width: 420px; margin: 8vh auto; padding: 20px; }
  .logo-big { font-size: 42px; text-align: center; font-weight: 500; letter-spacing: -1px; }
  .g-blue{color:#4285F4}.g-red{color:#EA4335}.g-yellow{color:#FBBC05}.g-green{color:#34A853}
  .field {
    width: 100%; padding: 13px 16px; margin: 8px 0; font: inherit; font-size: 15px;
    border: 1.5px solid #dadce0; border-radius: 6px; outline: none; background: #fff; color: #202124;
  }
  .field:focus { border-color: #1a73e8; box-shadow: 0 1px 0 0 #1a73e8 inset; }
  .primary-btn {
    float: right; background: #1a73e8; color: #fff; border: none; border-radius: 22px;
    padding: 11px 26px; font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; margin-top: 14px;
  }
  .primary-btn:hover { box-shadow: 0 1px 6px rgba(26,115,232,.5); }
  .muted { color: #5f6368; font-size: 13px; }
  h2.pg { font-size: 24px; margin-bottom: 18px; }

  .captcha-box {
    width: 320px; background: #f9f9f9; border: 1px solid #d3d3d3; border-radius: 4px;
    padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); margin: 26px auto;
  }
  .captcha-row { display: flex; align-items: center; justify-content: space-between; }
  .cbx {
    width: 26px; height: 26px; border: 2px solid #c1c1c1; border-radius: 3px; background: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #0c8a43;
  }
  .cbx.done { border-color: #0c8a43; }
  .grid3 {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0;
  }
  .cell {
    aspect-ratio: 1; border-radius: 4px; cursor: pointer; position: relative; overflow: hidden;
    filter: blur(1.6px); transition: outline .1s; outline: 3px solid transparent;
  }
  .cell.sel { outline: 3px solid #1a73e8; filter: blur(1.6px); }
  .verify { width: 100%; background: #1a73e8; color: #fff; border: none; border-radius: 3px; padding: 9px; font: inherit; cursor: pointer; }

  #viewport::-webkit-scrollbar, #doc::-webkit-scrollbar { width: 12px; height: 12px; }
  #viewport::-webkit-scrollbar-thumb, #doc::-webkit-scrollbar-thumb {
    background: #c5cad6; border-radius: 8px; border: 3px solid transparent; background-clip: content-box;
  }
  #viewport::-webkit-scrollbar-thumb:hover, #doc::-webkit-scrollbar-thumb:hover { background-color: #a9b0c2; }
  #viewport.dark::-webkit-scrollbar-thumb { background-color: #33384a; }

  .rbx-mark {
    width: 34px; height: 34px; border: 4.5px solid #000; border-radius: 4px;
    transform: rotate(13deg); position: relative; display: inline-block; flex-shrink: 0;
  }
  .rbx-mark::after { content: ""; position: absolute; inset: 6px; background: #000; border-radius: 1px; }
  .rbx-field {
    width: 100%; height: 46px; padding: 0 44px 0 14px; margin: 0 0 10px; font: inherit; font-size: 15px;
    border: none; outline: none; background: #f2f3f5; color: #16181d; border-radius: 8px; box-sizing: border-box;
  }
  .rbx-field::placeholder { color: #8a909b; }
  .rbx-field:focus { box-shadow: 0 0 0 2px #335fff inset; background: #eef0f4; }
  .rbx-btn {
    width: 100%; height: 46px; border: none; border-radius: 8px; background: #335fff; color: #fff;
    font: inherit; font-size: 15.5px; font-weight: 700; cursor: pointer; transition: background .12s;
  }
  .rbx-btn:hover { background: #244ee5; }
  .rbx-btn:disabled { background: #b9c2f5; cursor: default; }
  .rbx-link { color: #335fff; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .rbx-link:hover { text-decoration: underline; }
  .rbx-soc {
    width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #d7dae0; background: #fff;
    font-size: 19px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .rbx-soc:hover { background: #f5f6f8; }

  /* ======== РАБОЧИЙ СТОЛ ======== */
  #desktop { position: fixed; inset: 0; z-index: 0; }
  #wall { position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 108%, #3f9e3f 0 38%, transparent 39%), linear-gradient(#2f7fd4, #79c2ef 55%, #bfe6f7);
    transition: background .5s; }
  #marquee { position: absolute; border: 1px solid #9cd0ff; background: rgba(0,120,215,.28); display: none; z-index: 1; }
  #dicons { position: absolute; inset: 0 0 46px 0; z-index: 10; }
  .dicon {
    position: absolute; width: 88px; text-align: center; cursor: default; user-select: none;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.75); padding: 6px 2px; border-radius: 6px;
    transition: left .4s, top .4s, background .1s;
  }
  .dicon .g { font-size: 38px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); pointer-events: none; }
  .dicon .lb { font-size: 11.5px; margin-top: 4px; line-height: 1.25; pointer-events: none; }
  .dicon.sel { background: rgba(51,95,255,.38); outline: 1px dotted rgba(255,255,255,.85); }
  .sticky {
    position: absolute; right: 34px; top: 30px; width: 196px; z-index: 10; transform: rotate(2.6deg);
    background: linear-gradient(#fff9b0, #ffee7a); color: #57490a; padding: 14px 13px 15px; font-size: 12.5px;
    line-height: 1.55; box-shadow: 0 8px 22px rgba(0,0,0,.35); cursor: default;
  }
  .sticky::before { content: ""; position: absolute; left: 50%; top: -9px; width: 74px; height: 18px;
    transform: translateX(-50%) rotate(-2deg); background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.08); }
  .sticky s { opacity: .55; }
  #taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46px; z-index: 500;
    background: rgba(16,18,27,.94); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 12px; padding: 0 10px; color: #cfd6e4;
  }
  #startbtn {
    font: inherit; font-size: 13.5px; font-weight: 600; color: #e8ecf6; background: transparent; border: none;
    border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  #startbtn:hover { background: rgba(255,255,255,.1); }
  #tb-app { font-size: 12px; color: #8d96ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  #tray { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #ram {
    width: 54px; height: 12px; border: 1px solid #3a4156; border-radius: 4px; overflow: hidden; cursor: help; background: #10131c;
  }
  #ram i { display: block; height: 100%; width: 99%; background: repeating-linear-gradient(90deg, #e0554d 0 4px, #c23a33 4px 6px); }
  #sndbtn { font-size: 15px; background: none; border: none; cursor: pointer; }
  #clock { font-size: 12.5px; font-weight: 600; letter-spacing: .5px; }
  #startmenu, #ctxmenu {
    position: absolute; z-index: 550; background: #161927; border: 1px solid rgba(255,255,255,.09);
    border-radius: 12px; box-shadow: 0 18px 60px rgba(0,0,0,.55); padding: 7px; display: none; color: #dbe1f0;
  }
  #startmenu { left: 8px; bottom: 52px; width: 250px; }
  #ctxmenu { width: 236px; }
  .sm-it, .cx-it { font-size: 13px; padding: 10px 13px; border-radius: 8px; cursor: pointer; }
  .sm-it:hover, .cx-it:hover { background: #272d44; }
  .sm-sep { height: 1px; background: rgba(255,255,255,.09); margin: 6px 4px; }
  .cx-sub { font-size: 11px; color: #7d86a0; padding: 2px 13px 6px; }
  .osdlg {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    background: #1b1f2b; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: #dfe4f2;
    box-shadow: 0 26px 80px rgba(0,0,0,.6); min-width: 340px; max-width: min(92vw, 560px); overflow: hidden;
    animation: dlgpop .18s ease;
    max-height: 82vh; display: flex; flex-direction: column;
  }
  @keyframes dlgpop { from { transform: translate(-50%, -48%) scale(.96); opacity: 0; } }
  .osdlg .dh {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.07); cursor: grab;
    flex-shrink: 0;
  }
  .osdlg .dh .xx { margin-left: auto; cursor: pointer; opacity: .65; font-size: 15px; padding: 0 4px; }
  .osdlg .dh .xx:hover { opacity: 1; }
  .osdlg .db { padding: 16px 18px; font-size: 13px; line-height: 1.6; overflow-y: auto; }
  @keyframes jitter {
    0% { transform: translate(0,0); } 25% { transform: translate(1.5px,-1px); }
    50% { transform: translate(-1px,1.5px); } 75% { transform: translate(1px,1px); } 100% { transform: translate(0,0); }
  }
  .vibrating { animation: jitter .13s infinite; }
  .horror-dim { filter: brightness(.55) saturate(.7); transition: filter .8s; }
  body.horror-glitch { animation: glitchshift .2s infinite; }
  @keyframes glitchshift {
    0% { transform: translate(0); filter: none; } 30% { transform: translate(-3px,2px); filter: hue-rotate(40deg) contrast(1.25); }
    60% { transform: translate(3px,-1px); filter: invert(.08); } 100% { transform: translate(0); filter: none; }
  }
  #eyecur {
    position: fixed; z-index: 9700; font-size: 30px; pointer-events: none; display: none;
    transform: translate(-50%, -50%);
  }
  body.eye-cursor, body.eye-cursor * { cursor: none !important; }
  #jumpscare {
    position: fixed; inset: 0; z-index: 9800; background: #000; display: none;
    align-items: center; justify-content: center;
  }
  #jumpscare span {
    font-size: min(52vw, 52vh); animation: scarepulse .32s infinite alternate;
    filter: drop-shadow(0 0 60px rgba(255,0,0,.55));
  }
  @keyframes scarepulse { from { transform: scale(.92); } to { transform: scale(1.14) rotate(2deg); } }

  /* --- взлом системы --- */
  body.hacked, body.hacked * { cursor: none !important; }
  #ghostcur { position: fixed; z-index: 9750; width: 26px; height: 26px; pointer-events: none;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.65)); transition: none; will-change: transform; }
  .dicon.gone { transition: transform .5s cubic-bezier(.5,-.3,.7,.4), opacity .45s !important;
    transform: scale(.15) rotate(40deg) !important; opacity: 0 !important; }
  @keyframes boomshake {
    0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-9px,6px) rotate(-.7deg); }
    50% { transform: translate(8px,-7px) rotate(.6deg); } 75% { transform: translate(-6px,-4px) rotate(-.4deg); }
    100% { transform: translate(0,0) rotate(0); }
  }
  body.boom { animation: boomshake .09s linear infinite; }
  .claimtxt { position: fixed; top: 13%; left: 0; width: 100%; text-align: center; z-index: 9360;
    color: #c1121f; font-weight: 900; font-size: clamp(22px, 4vw, 46px); letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(193,18,31,.6), 0 2px 0 #300; opacity: 0; transition: opacity .9s;
    pointer-events: none; }
  .ripplefx { position: fixed; z-index: 9740; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border: 2px solid rgba(255,255,255,.85); border-radius: 50%; pointer-events: none;
    animation: rip .38s ease-out forwards; }
  @keyframes rip { from { transform: scale(.4); opacity: .95; } to { transform: scale(3.2); opacity: 0; } }
  .inksplat { position: absolute; left: 50%; top: 50%; width: 76px; height: 58px; background: #000;
    border-radius: 48% 52% 55% 45% / 55% 48% 52% 45%; transform: translate(-50%,-50%) rotate(-14deg);
    pointer-events: none; z-index: 6; }
  .redveil { position: fixed; inset: 0; z-index: 9355; pointer-events: none; opacity: 0; transition: opacity 1.3s;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(140,10,10,.38) 74%, rgba(90,0,0,.72) 100%); }
  body.shooting, body.shooting * { cursor: none !important; }
  #crossh { position: fixed; z-index: 9395; width: 34px; height: 34px; margin: -17px 0 0 -17px; pointer-events: none;
    display: flex; align-items: center; justify-content: center; }
  #crossh::before { content: ""; position: absolute; width: 30px; height: 30px; border: 2.5px solid #ffd23e; border-radius: 50%; }
  #crossh::after { content: ""; position: absolute; width: 4px; height: 4px; background: #ff3b30; border-radius: 50%;
    box-shadow: 0 0 8px #ff3b30; }
  .bullethole { position: fixed; z-index: 9367; width: 15px; height: 15px; margin: -7px 0 0 -7px; pointer-events: none;
    background: radial-gradient(circle at 40% 40%, #111 28%, #2e2620 60%, transparent 62%);
    box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .tgt { position: fixed; z-index: 9369; width: 56px; height: 56px; margin: -28px 0 0 -28px; pointer-events: none;
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.5)); will-change: left, top; }

  .dm-mini {
    width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(#2a3048,#171a24);
    border: 1.5px solid #3a4468; display: flex; align-items: center; justify-content: center;
    font-size: 23px; cursor: pointer; z-index: 41; position: absolute; right: 16px; bottom: 16px;
    box-shadow: 0 8px 26px rgba(0,0,0,.5); transition: transform .15s;
  }
  .dm-mini:hover { transform: scale(1.09); }
  .dm-unread {
    position: absolute; top: -3px; right: -3px; width: 15px; height: 15px; border-radius: 50%;
    background: #e0554d; border: 2px solid #14161f;
  }
  .shakey { animation: tshake .35s; }

  #navtb {
    display: flex; gap: 3px; padding: 4px 8px; background: #292b2f; border-bottom: 1px solid rgba(0,0,0,.35);
  }
  #navtb button {
    width: 28px; height: 28px; border: none; border-radius: 50%; background: transparent;
    color: #b6bdca; font-size: 14px; cursor: pointer; line-height: 1;
  }
  #navtb button:hover { background: #3c4048; color: #fff; }
  #navtb button:active { transform: scale(.92); }

  .ql {
    font-size: 17px; padding: 5px 7px; border-radius: 7px; cursor: pointer; user-select: none;
  }
  .ql:hover { background: rgba(255,255,255,.12); }
  #langbtn {
    font: inherit; font-size: 11px; font-weight: 700; color: #cfd6e4; background: rgba(255,255,255,.07);
    border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer;
  }
  #langbtn:hover { background: rgba(255,255,255,.16); }

  .dm-msg {
    max-width: 82%; margin-top: 7px; padding: 7px 11px; border-radius: 11px; font-size: 12.3px; line-height: 1.45;
    word-wrap: break-word; animation: dlgpop .15s ease;
  }
  .dm-msg.he { align-self: flex-start; background: #262b3d; color: #dfe4f2; border-bottom-left-radius: 3px; }
  .dm-msg.me { align-self: flex-end; background: #335fff; color: #fff; border-bottom-right-radius: 3px; }
  .dm-sys { align-self: center; color: #66719c; font-size: 10.5px; margin-top: 6px; }
  #dm-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  #dm-chips button {
    font: inherit; font-size: 10.8px; color: #9fb0ff; background: rgba(51,95,255,.14); border: 1px solid rgba(126,162,255,.35);
    border-radius: 12px; padding: 4px 10px; cursor: pointer;
  }
  #dm-chips button:hover { background: rgba(51,95,255,.3); }
  #dm-inrow { display: flex; gap: 6px; margin-top: 9px; }
  #dm-inp {
    flex: 1; min-width: 0; font: inherit; font-size: 12.3px; color: #eef1fb; background: #10131c;
    border: 1px solid #2a3048; border-radius: 9px; padding: 8px 10px; outline: none;
  }
  #dm-inp:focus { border-color: #335fff; }
  #dm-send {
    border: none; border-radius: 9px; background: #335fff; color: #fff; font-weight: 800; cursor: pointer; padding: 0 13px;
  }
  @keyframes busgo { to { left: 104%; } }

  .toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%) translateY(20px);
    background: #111; color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: all .25s; z-index: 3000; pointer-events: none; max-width: 80vw; text-align: center;
  }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .toast.bad { background: #7a1420; }

  .lvlcard {
    position: absolute; inset: 0; z-index: 20; background: rgba(8,10,20,.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    color: #dfe6ff; padding: 30px;
  }
  .lvlcard .num { font-size: 15px; letter-spacing: 5px; color: #7ea2ff; }
  .lvlcard .name { font-size: clamp(26px, 4.6vw, 44px); margin: 14px 0; letter-spacing: 2px; }
  .lvlcard .desc { max-width: 560px; line-height: 1.7; color: #98a2c6; }
  .lvlcard button { margin-top: 30px; }

  .win-check {
    position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(6,26,12,.93);
  }
  .win-check .ok {
    width: 86px; height: 86px; border-radius: 50%; background: #0c8a43; color: #fff;
    font-size: 48px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 50px rgba(12,180,80,.6); animation: pop .4s cubic-bezier(.2,2,.4,1);
  }
  @keyframes pop { from { transform: scale(0); } }
  .win-check p { margin-top: 18px; color: #bdf0cf; letter-spacing: 2px; }

  .pinpad { display: grid; grid-template-columns: repeat(3, 74px); gap: 10px; justify-content: center; margin: 20px 0; }
  .pinpad button {
    height: 58px; font-size: 21px; font-weight: 600; border: none; border-radius: 10px;
    background: #eee; cursor: pointer; transition: background .12s;
  }
  .pinpad button:hover { background: #dbe4ff; }
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 16px 0; }
  .pin-dots i { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #888; }
  .pin-dots i.on { background: #1a73e8; border-color: #1a73e8; }

<script>

function toast(msg, bad, ms = 2600) {

  clearTimeout(t._h);

}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.random() * arr.length | 0];

const Clean = {
  fns: [],
  add(fn) { this.fns.push(fn); },
  run() { this.fns.forEach(f => { try { f(); } catch (e) {} }); this.fns = []; }
};
function T(iv) { Clean.add(() => clearInterval(iv)); return iv; }

function Ls(tgt, ev, fn, opt) { tgt.addEventListener(ev, fn, opt); Clean.add(() => tgt.removeEventListener(ev, fn, opt)); return fn; }

addEventListener("error", e => { try { toast("💥 " + e.message + " (строка " + e.lineno + ")"); } catch (_) {} });

let _ac = null;
function acx() { try { return _ac || (_ac = new (window.AudioContext || window.webkitAudioContext)()); } catch (e) { return null; } }
function tone(o) {
  if (typeof MUTED !== "undefined" && MUTED) return;
  const a = acx(); if (!a) return;
  const { f0, f1 = o.f0, type = "sine", dur = .1, vol = .14, delay = 0, lp = 0 } = o;
  const t0 = a.currentTime + delay;
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = osc;
  if (lp) { const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp; osc.connect(f); node = f; }
  node.connect(g); g.connect(a.destination);
  osc.start(t0); osc.stop(t0 + dur + .05);
}
function nz(o) {
  if (typeof MUTED !== "undefined" && MUTED) return;
  const a = acx(); if (!a) return;
  const { dur = .06, vol = .1, hp = 0, lp = 0, delay = 0 } = o;
  const t0 = a.currentTime + delay;
  const buf = a.createBuffer(1, Math.max(1, a.sampleRate * dur | 0), a.sampleRate);
  const d = buf.getChannelData(0);
  let lastv = 0;
  for (let i = 0; i < d.length; i++) { lastv = (lastv + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = lastv * 3; }
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = src;
  if (hp) { const f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp; src.connect(f); node = f; }
  if (lp) { const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp; node.connect(f); node = f; }
  node.connect(g); g.connect(a.destination);
  src.start(t0);
}
function sound(kind) {
  try {
    switch (kind) {
      case "click":
        tone({ f0: 1300, f1: 160, type: "triangle", dur: .03, vol: .1 });
        nz({ dur: .018, vol: .07, hp: 2600 });
        break;
      case "pop":
        tone({ f0: 300, f1: 1500, type: "sine", dur: .05, vol: .16 });
        break;
      case "good":
        [[523, 0], [659, .07], [784, .14], [1046, .21]].forEach(([f, dl]) =>
          tone({ f0: f, type: "triangle", dur: .16, vol: .13, delay: dl, lp: 2200 }));
        nz({ dur: .3, vol: .04, hp: 3000, delay: .22 });
        break;
      case "bad": {
        tone({ f0: 152, type: "sawtooth", dur: .32, vol: .12, lp: 900 });
        tone({ f0: 146, type: "square", dur: .32, vol: .09, lp: 700 });
        tone({ f0: 110, f1: 55, type: "sawtooth", dur: .28, vol: .1, delay: .05 });
        break;
      }
      case "win":
        [[392, 0], [523, .1], [659, .2], [784, .3], [1046, .45]].forEach(([f, dl]) =>
          tone({ f0: f, type: "square", dur: .22, vol: .08, delay: dl, lp: 2400 }));
        break;
      case "demon":
        tone({ f0: 660, f1: 880, type: "sine", dur: .09, vol: .1 });

}
let humOn = false;
function startHum() {
  if (humOn) return;
  const a = acx(); if (!a) return;
  humOn = true;
  const buf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
  const d = buf.getChannelData(0);
  let lv = 0;
  for (let i = 0; i < d.length; i++) { lv = (lv + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = lv; }
  const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 110;
  const g = a.createGain(); g.gain.value = 0.05;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}

let demianBox = null, demianMini = null, demianIdle = null, dmGreeted = false, dmBusy = false;

  fail: ["Мой дед печатает быстрее.", "Я это видел. Камера тоже.", "Хотите совет? Не делайте так.", "Записал в дело №" + (Math.random() * 900 | 0) + "."],

  [/дурак|ло[хx]|идиот|тупо|ненавиж|дура|бот\b/i, ["Ой-ой, какие мы дерзкие. Перезагрузить тебе систему?", "За такое в моей конторе увольняют. Ты уволен. Продолжай играть."]],

function dmPush(text, me) {
  dmHistory.push({ t: text, me: !!me });

  if (demianBox) { dmRender(); }

    dmUnread++;

function makeTab(title, favColor, url, buildFn, closable = true) {

  tabs.push(tab);
  renderTabs();
  activate(tab);
  return tab;
}
function closeTab(tab) {
  const wasActive = tab === activeTab;
  tabs = tabs.filter(t => t !== tab);
  if (tab.el) tab.el.remove();
  if (!tabs.length) { sound("pop"); startLevel(); return; }
  if (wasActive) activate(tabs[tabs.length - 1]);
  else renderTabs();
}
function activate(tab) {
  activeTab = tab;

  if (!tab) { $("#url").textContent = "about:blank"; renderTabs(); return; }
  $("#url").textContent = tab.url;
  tab.buildFn(vp, tab);
  renderTabs();
}
function renderTabs() {

    el.innerHTML = `<span class="fav" style="background:${tab.favColor}"></span><span class="t">${tab.title}</span><span class="x">×</span>`;
    el.querySelector(".x").onclick = e => { e.stopPropagation(); sound("pop"); closeTab(tab); };

}

function robloxCaptcha(page) {
  page.innerHTML = `
    <div style="position:absolute;inset:0;background:rgba(10,12,16,.62);display:flex;align-items:center;justify-content:center;z-index:10;">

          <span style="margin-left:auto;color:#6d7275;font-size:11px;">RoboCAPTCHA™ v2.7</span>
        </div>
        <div style="color:#9aa0a6;font-size:12.5px;margin-top:5px;">Выберите 3 размытых собаки. Они все размытые.</div>
        <div class="grid3" id="grid" style="gap:7px;"></div>
        <button id="vr" class="rbx-btn" style="height:42px;font-size:14px;">ПОДТВЕРДИТЬ (собака)</button>
        <div style="text-align:right;color:#565b60;font-size:10px;margin-top:7px;">почти reCAPTCHA · приватность? смешно</div>
      </div>
    </div>`;
  const grid = page.querySelector("#grid");
  const dogs = new Set();
  while (dogs.size < 3) dogs.add(Math.random() * 9 | 0);
  const furColors = ["#a97c50", "#7a5230", "#c49a6c", "#5d4633", "#8c8c8c"];
  const dogSVG = c => `<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
    <rect width="100" height="100" fill="${pick(["#dce7f0", "#e8e2d4", "#dfe8dc"])}"/>
    <ellipse cx="50" cy="66" rx="26" ry="22" fill="${c}"/>
    <circle cx="50" cy="38" r="21" fill="${c}"/>
    <path d="M32 28 Q26 6 44 18 Z" fill="${c}"/><path d="M68 28 Q74 6 56 18 Z" fill="${c}"/>
    <path d="M33 24 Q29 10 42 17 Z" fill="${shade(c,-30)}"/><path d="M67 24 Q71 10 58 17 Z" fill="${shade(c,-30)}"/>
    <circle cx="43" cy="36" r="3" fill="#1c1c1c"/><circle cx="57" cy="36" r="3" fill="#1c1c1c"/>
    <ellipse cx="50" cy="47" rx="6" ry="4.5" fill="#1c1c1c"/>
    <path d="M50 51 Q46 56 41 53 M50 51 Q54 56 59 53" stroke="#1c1c1c" stroke-width="1.6" fill="none"/>
    <ellipse cx="50" cy="88" rx="30" ry="7" fill="${shade(c,-45)}"/></svg>`;
  const catSVG = c => `<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
    <rect width="100" height="100" fill="#e9e4da"/>
    <circle cx="50" cy="52" r="24" fill="${c}"/>
    <path d="M32 38 L28 12 L48 26 Z" fill="${c}"/><path d="M68 38 L72 12 L52 26 Z" fill="${c}"/>
    <circle cx="42" cy="48" r="3" fill="#d8ff3e"/><circle cx="58" cy="48" r="3" fill="#d8ff3e"/>
    <path d="M46 60 Q50 63 54 60" stroke="#1c1c1c" stroke-width="1.8" fill="none"/>
    <g stroke="#fff" stroke-width="1"><path d="M20 58 L40 60 M20 66 L40 63 M80 58 L60 60 M80 66 L60 63"/></g></svg>`;
  const sceneSVG = () => `<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none">
    <rect width="100" height="100" fill="#bcd7ee"/><circle cx="76" cy="24" r="12" fill="#ffd23e"/>
    <path d="M0 78 Q28 52 52 78 T100 76 L100 100 L0 100 Z" fill="${pick(["#4a6fa5", "#397a4e", "#6b8e4e"])}"/>
    <path d="M0 88 Q40 70 100 90 L100 100 L0 100 Z" fill="${pick(["#2c4a77", "#2f5d3a"])}"/></svg>`;
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const cl = v => Math.max(0, Math.min(255, v));
    return "#" + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => cl(v + amt).toString(16).padStart(2, "0")).join("");
  }
  for (let i = 0; i < 9; i++) {
    const c = document.createElement("div");
    c.className = "cell";
    c.style.borderRadius = "8px";
    c.style.filter = `blur(${rnd(1.2, 2.2)}px)`;
    if (dogs.has(i)) c.innerHTML = dogSVG(pick(furColors));
    else c.innerHTML = Math.random() < .5 ? catSVG(pick(["#777", "#9c7b5a", "#4a4a4a"])) : sceneSVG();
    c.oncontextmenu = e => e.preventDefault();
    c.onclick = () => { sound("click"); c.classList.toggle("sel"); };
    grid.appendChild(c);
  }
  page.querySelector("#vr").onclick = () => {
    const sel = [...grid.children].map((c, i) => c.classList.contains("sel") ? i : -1).filter(i => i >= 0);
    if (sel.length !== 3) { fail("Ровно три, гений."); return; }

    else { fail("Там были коты. Попробуй заново."); robloxCaptcha(page); }
  };
}

let _noop = () => {};
function staticNone() {}

function dinoGame(canvas, status, onWin) {
  if (window._dinoCleanup) window._dinoCleanup();
  const g = canvas.getContext("2d");
  let y = 0, vy = 0, last = performance.now(), obst = [], spawnT = 0.9, elapsed = 0, dead = false;
  const jump = e => {
    if ((e.code === "Space" || e.type === "mousedown") && y === 0) {
      if (e.code === "Space") e.preventDefault();
      vy = -340;
    }
  };
  addEventListener("keydown", jump);
  canvas.addEventListener("mousedown", jump);
  window._dinoCleanup = () => {
    dead = true;
    removeEventListener("keydown", jump);
  };
  let raf;
  (function loop(now) {
    if (dead) return;
    const dt = Math.min(0.04, (now - last) / 1000);
    last = now;
    elapsed += dt;
    vy += 1050 * dt;
    y += vy * dt;
    if (y > 0) { y = 0; vy = 0; }
    spawnT -= dt;
    if (spawnT <= 0 && elapsed < 9) {
      spawnT = rnd(0.75, 1.25);
      obst.push({ x: canvas.width + 10, w: 15, h: rnd(22, 36) });
    }
    obst.forEach(o => o.x -= 200 * dt);
    obst = obst.filter(o => o.x > -24);
    for (const o of obst) {
      if (o.x < 48 && o.x + o.w > 26 && y > -(o.h - 6)) {
        elapsed = 0;
        obst = [];
        spawnT = 0.9;
        sound("bad");
        break;
      }
    }
    g.fillStyle = "#f7f7f7";
    g.fillRect(0, 0, canvas.width, canvas.height);
    g.fillStyle = "#535353";
    g.fillRect(0, 120, canvas.width, 2);
    g.fillRect(26, 98 + y, 20, 20);
    g.fillRect(42, 90 + y, 14, 11);
    g.fillStyle = "#f7f7f7";
    g.fillRect(50, 93 + y, 3, 3);
    g.fillStyle = "#535353";
    obst.forEach(o => g.fillRect(o.x, 120 - o.h, o.w, o.h));
    status.textContent = "ВЫЖИЛ: " + elapsed.toFixed(1) + " / 10 сек (ПРОБЕЛ — прыжок)";
    if (elapsed >= 10) {
      dead = true;
      removeEventListener("keydown", jump);
      window._dinoCleanup = null;
      onWin();
      return;
    }
    raf = requestAnimationFrame(loop);
  })(last);
}

/* --- перетаскивание окна браузера за шапку --- */
function dragHandle(handle, el, guard) {
  handle.addEventListener("mousedown", e => {
    if (e.button !== 0 || (guard && guard(e))) return;
    const r = el.getBoundingClientRect();
    el.style.position = "fixed";
    Object.assign(el.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", margin: "0", transform: "none", right: "auto", bottom: "auto", maxWidth: "none" });
    const sx = e.clientX, sy = e.clientY, ol = r.left, ot = r.top;
    const mv = ev => {
      el.style.left = Math.max(-r.width + 90, Math.min(innerWidth - 90, ol + ev.clientX - sx)) + "px";
      el.style.top = Math.max(0, Math.min(innerHeight - 50, ot + ev.clientY - sy)) + "px";
    };
    const up = () => { removeEventListener("mousemove", mv); removeEventListener("mouseup", up); };
    addEventListener("mousemove", mv); addEventListener("mouseup", up);
  });
}
dragHandle($("#chrome-bar"), $("#browser"), e => !!e.target.closest(".tab"));

    <div id="cg" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px;">
      ${["7", "8", "9", "/", "4", "5", "6", "*", "1", "2", "3", "-", "C", "0", "=", "+"].map(k =>
      `<button data-k="${k}" style="height:44px;font:inherit;font-size:17px;font-weight:700;border:none;border-radius:8px;
        background:${k === "=" ? "#335fff" : "+-*/".includes(k) ? "#3a4156" : "#262b3d"};color:#fff;cursor:pointer;">${k}</button>`).join("")}
    </div>`;
  const disp = db.querySelector("#cd"), exc = db.querySelector("#ce");
  let cur = null, op = null, fresh = true;
  const show = v => disp.textContent = String(v).slice(0, 14);
  function calc(a, o, b) {
    if (o === "+") return a + b + 1;
    if (o === "-") return a - b + (Math.random() < .3 ? rnd(1, 3) : 0);
    if (o === "*") return (a === 7 && b === 8) || (a === 8 && b === 7) ? "ОЧЕНЬ МНОГО" : a * b * 2;
    if (o === "/") {
      if (!b) return "ВЗРЫВ ПРОЦЕССОРА";
      return +(a / b - 0.000001).toFixed(6);
    }
    return b;
  }
  db.querySelectorAll("[data-k]").forEach(btn => btn.onclick = () => {
    const k = btn.dataset.k;
    sound("click");
    if ("0123456789".includes(k)) {
      disp.textContent = fresh || disp.textContent === "0" ? k : (disp.textContent + k).slice(0, 14);
      fresh = false; exc.textContent = "";
    } else if ("+-*/".includes(k)) {
      cur = parseFloat(disp.textContent) || 0; op = k; fresh = true;
      exc.textContent = "";
    } else if (k === "C") { cur = null; op = null; fresh = true; show(0); exc.textContent = ""; }
    else if (k === "=" && op !== null) {
      const r = calc(cur, op, parseFloat(disp.textContent) || 0);
      show(r);
      exc.textContent = r === "ВЗРЫВ ПРОЦЕССОРА" ? "…ой." : pick(EXCUSES);
      if (r === "ВЗРЫВ ПРОЦЕССОРА") {
        sound("bad");
        const root = db.parentElement; root.classList.add("shakey"); setTimeout(() => root.classList.remove("shakey"), 380);
      }
      op = null; fresh = true;
    }
  });
}

      document.body.appendChild(sprBus); document.body.appendChild(sprClk);

      let alive = true;
      cleanups.push(() => { alive = false; });
      const W = 320, H = 200;
      function render() {
        cx.fillStyle = "#14100e"; cx.fillRect(0, 0, W, 100);
        cx.fillStyle = "#241c16"; cx.fillRect(0, 100, W, 100);
        for (let col = 0; col < W; col++) {
          const camX = 2 * col / W - 1;
          const rdx = Math.cos(P.a) + (-Math.sin(P.a)) * camX * .66;
          const rdy = Math.sin(P.a) + Math.cos(P.a) * camX * .66;
          let mapX = P.x | 0, mapY = P.y | 0;
          const ddx = Math.abs(1 / (rdx || 1e-9)), ddy = Math.abs(1 / (rdy || 1e-9));
          let stepX, stepY, sideX, sideY;
          if (rdx < 0) { stepX = -1; sideX = (P.x - mapX) * ddx; } else { stepX = 1; sideX = (mapX + 1 - P.x) * ddx; }
          if (rdy < 0) { stepY = -1; sideY = (P.y - mapY) * ddy; } else { stepY = 1; sideY = (mapY + 1 - P.y) * ddy; }
          let side = 0, guard = 0, ch = "#";
          while (guard++ < 64) {
            if (sideX < sideY) { sideX += ddx; mapX += stepX; side = 0; }
            else { sideY += ddy; mapY += stepY; side = 1; }
            ch = (MAP[mapY] || "#")[mapX] || "#";
            if (ch !== "." ) break;
          }
          const dist = Math.max(.05, side === 0 ? sideX - ddx : sideY - ddy);
          const lh = Math.min(H * 2, H / dist | 0);
          const y0 = (H - lh) / 2 | 0;
          let rgb = COLORS[ch] || COLORS["#"];
          let sh = 1 / (1 + dist * .28);
          if (side) sh *= .72;
          if (ch === "c") sh *= .8 + .35 * Math.random();
          cx.fillStyle = `rgb(${rgb[0] * sh | 0},${rgb[1] * sh | 0},${rgb[2] * sh | 0})`;
          cx.fillRect(col, y0, 1, lh);
          if (ch === "w") {
            cx.fillStyle = dist < 6 ? `rgba(255,60,30,${.25 * sh})` : "rgba(10,8,14,.9)";

          const depth = dx * Math.cos(P.a) + dy * Math.sin(P.a);
          const lat = -dx * Math.sin(P.a) + dy * Math.cos(P.a);
          if (depth > .3) {
            const sc = (H / depth) / 200;
            el.style.display = "block";

      }
      let last = performance.now(), tLeft = 10;
      let meltedPlayed = false;
      (function loop(now) {

        const dt = Math.min(.06, (now - last) / 1000); last = now;
        const sp = 2.3 * dt, rot = 2.7 * dt;

        if (keys["s"] || keys["arrowdown"]) { fx -= Math.cos(P.a); fy -= Math.sin(P.a); }
        if (keys["a"]) { fx += Math.sin(P.a); fy -= Math.cos(P.a); }

        if (meltedPlayed) { requestAnimationFrame(loop); return; }
        if ((10 - tLeft | 0) !== loop._lastS) {

function openTaskKiller() {
  const db = osDialog("⚙️ TaskDestroyer.exe · диспетчер незадач", 430);

      <span>Закрыто: <b id="tk-s">0</b></span><span>CPU: <b style="color:#ff8a80;" id="tk-cpu">146%</b></span></div>`;
  const list = db.querySelector("#tk-list"), scoreEl = db.querySelector("#tk-s"), cpuEl = db.querySelector("#tk-cpu");
  let score = 0, spawned = 0;
  const NAMES = ["Trolleybus_Fuel.exe", "Valery_Crying.wav", "Demyan_Sarcasm.dll", "Robux_Miner.sys", "NotAPassword.txt (процесс!)", "Soul_Debt.pak", "Chaos_Pinpad.tmp"];
  function spawn() {
    if (!document.body.contains(list)) { clearInterval(spawner); return; }
    const name = Math.random() < .12 ? "Бездействие системы" : pick(NAMES);
    const row = document.createElement("div");
    row.className = "trfile";
    row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-top:1px solid rgba(255,255,255,.07);animation:dlgpop .2s ease;";
    row.innerHTML = `<span>${pick(["🧟", "🐌", "🔥", "📦"])} ${name} <span style="color:#8d96ad;font-size:11px;">CPU ${(rnd(3, 99) | 0)}%</span></span>
      <button style="border:none;background:#e0554d;color:#fff;border-radius:5px;cursor:pointer;font-size:11px;padding:3px 9px;">✕</button>`;
    row.querySelector("button").onclick = () => {
      sound("pop");
      row.remove();
      score++;
      scoreEl.textContent = score;
      cpuEl.textContent = Math.min(999, 146 + score * 7) + "%";
      if (name === "Бездействие системы") {
        toast("«Чувак, я устал ничего не делать, дай отдохнуть!»");
        demianSay("idle");
      }
      spawn(); spawn();
    };
    list.prepend(row);
    spawned++;
    while (list.children.length > 9) list.lastChild.remove();
  }
  const spawner = setInterval(spawn, 850);
  spawn();
}
